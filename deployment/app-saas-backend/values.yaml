replicaCount: 1

saasBackend:
  name: saas-app-backend
  group: app
  container:
    image: ghcr.io/um-org/no-code-testing-app
    tag: v1.0.3
    port: 8000
  service:
    type: NodePort
    port: 30010
    protocol: TCP
    targetPort: 8000
    nodePort: 30010
  volume:
    name: saas-app-backend-storage
    kind: PersistentVolumeClaim
    mountPath: /app/static
    pvc:
      name: saas-app-backend-storage-persistent-volume-claim
      accessMode: ReadWriteOnce
      storage: 4Gi
  config:
    name: saas-app-backend-config
