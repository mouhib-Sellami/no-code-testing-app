      MINIO_HOST_PROTOCOL: "http://"
      MINIO_PUBLIC_HOST: dg1j75rwzy.oxahost.svr.computeservers.oxa.host/minio
      MINIO_DEFAULT_BUCKETS: server-bucket
      MQTT_BROKER_HOST: "emqx-clusterip.default.svc.cluster.local"
