apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.minio.name }}-clusterip
  labels: 
    group: {{ .Values.minio.group }}
spec:
  type: ClusterIP
  selector:             
    app: {{ .Values.minio.name }}
  ports:
    - port: {{ .Values.minio.service.ports.minioPort.port  }}       
      targetPort: {{ .Values.minio.service.ports.minioPort.targetPort }}
      protocol: TCP
