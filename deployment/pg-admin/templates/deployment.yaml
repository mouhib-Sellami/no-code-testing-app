apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.pgAdmin.name | quote }}
  labels:
    app: {{ .Values.pgAdmin.name | quote }}
    group: {{ .Values.pgAdmin.group | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.pgAdmin.name | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.pgAdmin.name | quote }}
        group: {{ .Values.pgAdmin.group | quote }}
    spec:
      volumes:
        - name: {{ .Values.pgAdmin.volume.name | quote }}
          persistentVolumeClaim:
            claimName: {{ .Values.pgAdmin.volume.pvc.name | quote }}
      containers:
        - name: {{ .Values.pgAdmin.name | quote }}
          image: {{ .Values.pgAdmin.container.image | quote }}
          imagePullPolicy: {{ .Values.pgAdmin.container.imagePullPolicy | default "IfNotPresent" | quote }}
          ports:
            - name: pg-admin
              containerPort: {{ .Values.pgAdmin.container.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.pgAdmin.config.name | quote }}
            - secretRef:
                name: {{ .Values.pgAdmin.secretConfig.name | quote }}
          volumeMounts:             
            - name: {{ .Values.pgAdmin.volume.name | quote }}
              mountPath: {{ .Values.pgAdmin.volume.mountPath | quote }}
          {{- with .Values.pgAdmin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}