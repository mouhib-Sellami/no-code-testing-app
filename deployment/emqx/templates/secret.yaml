apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.emqx.secretConfig.name | quote }}
  labels:
    app: {{ .Values.emqx.name | quote }}
    group: {{ .Values.emqx.group | quote }}
type: Opaque
data:
  EMQX_DASHBOARD__DEFAULT_USER__PASSWORD: {{ .Values.emqx.secretConfig.data.EMQX_DASHBOARD__DEFAULT_USER__PASSWORD | quote }}
  EMQX_DASHBOARD__DEFAULT_USERNAME: {{ .Values.emqx.secretConfig.data.EMQX_DASHBOARD__DEFAULT_USERNAME | quote }}
  EMQX_DEFAULT_PASSWORD: {{ .Values.emqx.secretConfig.data.EMQX_DEFAULT_PASSWORD | quote }}
  EMQX_DEFAULT_USERNAME: {{ .Values.emqx.secretConfig.data.EMQX_DEFAULT_USERNAME | quote }}