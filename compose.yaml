services:

  postgres:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx-config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - server_container
      - web_app
    networks:
      - app_network

  server_container:
    container_name: server_container
    networks:
      - app_network
    build:
      context: ./no_code_testing_app_server
    ports:
      - "${SERVER_PORT}:8000"
    env_file:
      - .env
    volumes:
      - ./no_code_testing_app_server:/app
      - static_volume:/app/static
      - ./no_code_testing_app_server/media:/app/media
    depends_on:
      - minio
      - postgres

  web_app:
    container_name : no_code_web_app
    build:
      context: ./no-code-testing-app-front
      dockerfile: Dockerfile.prod
    env_file:
      - ./no-code-testing-app-front/.env.production
    ports:
      - "88:88"
    depends_on:
      - server_container
    networks:
      - app_network

  minio:
    container_name: minio
    networks:
      - app_network
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    restart: always

  create-bucket:
    networks:
    - app_network
    image: minio/mc:latest
    environment:
      MC_HOST_minio: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    entrypoint:
      - sh
      - -c
      - |
        until mc ls minio > /dev/null 2>&1; do
          sleep 0.5
        done
        mc mb minio/${MINIO_DEFAULT_BUCKETS}

  emqx:
    image: emqx/emqx:5.8.4
    container_name: app-emqx-broker
    env_file:
      - .env
    ports:
      - "${EMQX_MQTT_TCP_PORT}:1883"
      - "${EMQX_MQTT_SSL_PORT}:8883"
      - "${EMQX_WS_PORT}:8083"
      - "${EMQX_WSS_PORT}:8084"
      - "${EMQX_DASHBOARD_PORT}:18083"
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  minio_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  postgres_data:
  pgadmin_data:
