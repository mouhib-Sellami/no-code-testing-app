name: Deploy APP TO PROD

on:
  push:
    branches:
    - prod

jobs:
  connect-and-pull:
    name: SSH into VM and Pull Repo
    runs-on: ubuntu-latest
    steps:
    - name: Connect ssh
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: whoami

    - name: Clone the repo
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd /home/${{ secrets.USER }}
          git clone https://github.com/${{ github.repository }}.git || true
          cd ${{ github.repository }} && git pull origin prod
