name: Deploy APP TO PROD

on:
  push:
    branches:
    - prod

jobs:
  connect-ssh:
    name: SSH into VM and Pull Repo
    runs-on: ubuntu-latest
    steps:
    - name: Connect ssh
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: whoami

  clone-checkout-prod:
    name: clone repo and checkout
    runs-on: ubuntu-latest
    needs: connect-ssh
    steps:
    - name: Clone the repo
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd /home/${{ secrets.USER }}
          git clone git@github.com:${{ github.repository }}.git || true
          cd no-code-testing-app && git checkout prod && git pull origin prod

  deploy-emqx:
    name: deploy-emqx-broker
    runs-on: ubuntu-latest
    needs: clone-checkout-prod
    steps:
    - name: deploy-emqx
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd no-code-testing-app/deployment/emqx
          helm upgrade --install emqx .

  deploy-postgres:
    name: deploy-postgres
    runs-on: ubuntu-latest
    needs: clone-checkout-prod
    steps:
    - name: deploy-postgres
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd no-code-testing-app/deployment/postgres
          helm upgrade --install emqx .

  deploy-pg-admin:
    name: deploy-pg-admin
    runs-on: ubuntu-latest
    needs: clone-checkout-prod
    steps:
    - name: deploy-pg-admin
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd no-code-testing-app/deployment/posgtres
          helm upgrade --install pg-admin .
