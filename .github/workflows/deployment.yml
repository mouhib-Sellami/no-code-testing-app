name: Deploy APP TO PROD

on:
  push:
    branches:
    - prod

jobs:
  connect-ssh:
    name: SSH into VM and Pull Repo
    runs-on: ubuntu-latest
    steps:
    - name: Connect ssh
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          whoami
          exit 0

  clone-checkout-prod:
    name: clone repo and checkout
    runs-on: ubuntu-latest
    needs: connect-ssh
    steps:
    - name: Clone the repo
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd /home/${{ secrets.USER }}
          git clone git@github.com:${{ github.repository }}.git || true
          cd no-code-testing-app && git checkout prod && git pull origin prod
          exit 0

  deploy-emqx:
    name: deploy-emqx-broker
    runs-on: ubuntu-latest
    needs: clone-checkout-prod
    steps:
    - name: deploy-emqx
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd no-code-testing-app/deployment/emqx
          helm upgrade --install emqx .
          exit 0

  deploy-postgres:
    name: deploy-postgres
    runs-on: ubuntu-latest
    needs: clone-checkout-prod
    steps:
    - name: deploy-postgres
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd no-code-testing-app/deployment/postgres
          helm upgrade --install postgres .
          exit 0

  deploy-pg-admin:
    name: deploy-pg-admin
    runs-on: ubuntu-latest
    needs: clone-checkout-prod
    steps:
    - name: deploy-pg-admin
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          cd no-code-testing-app/deployment/pg-admin
          helm upgrade --install pg-admin .
          exit 0

  deploy-nginx:
    name: Deploy and reload Nginx
    runs-on: ubuntu-latest
    needs:
    - deploy-emqx
    - deploy-postgres
    - deploy-pg-admin
    steps:
    - name: Replace nginx.conf and reload nginx
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER }}
        password: ${{ secrets.PASSWORD }}
        script: |
          sudo rm -f /etc/nginx/nginx.conf
          sudo cp /home/${{ secrets.USER }}/no-code-testing-app/deployment/nginx-config/default.conf /etc/nginx/nginx.conf
          sudo nginx -s reload
          exit 0
